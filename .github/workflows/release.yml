# Made By FALCREB
# v ile başlayan her tag'de indirilebilir paketi GitHub Releases'e yükler.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: zip -r home-assistant-watchdogs.zip templates docs secrets.yaml.example README.md LICENSE
      - run: sha256sum home-assistant-watchdogs.zip > home-assistant-watchdogs.zip.sha256
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" home-assistant-watchdogs.zip home-assistant-watchdogs.zip.sha256 --generate-notes --verify-tag
